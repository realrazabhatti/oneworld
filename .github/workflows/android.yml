name: Build OneWorld Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: flutter create --project-name oneworld --org com.oneworld build_project

      - name: Add OneWorld code
        run: cp lib/main.dart build_project/lib/main.dart

      - name: Build Android APK
        working-directory: build_project
        run: |
          flutter pub get
          flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: OneWorld-Android
          path: build_project/build/app/outputs/flutter-apk/app-release.apk
